name: CI Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-test-and-docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Baja el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Instala Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Code Build - Instala dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Static Code Analysis - Revisa que el código esté limpio
      - name: Run ESLint
        run: npx eslint . --ext .js || npm run lint || echo "No lint script, skipping"

      # 5. Unit Tests + Code Coverage
      - name: Run Unit Tests with Coverage
        run: npm test -- --coverage

      # 6. Sube el reporte de cobertura como artefacto
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/

      # 7. Docker Build & Push
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devsu-demo-nodejs:latest

      # 8. Opcional - Vulnerability Scan con Trivy
      - name: Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/devsu-demo-nodejs:latest
          format: 'table'
          exit-code: '0'